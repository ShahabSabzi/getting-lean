<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Getting Lean"><link rel="apple-touch-icon" href="getting-lean-icon-v2.png"><title>60 Day Reset</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script><script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>:root{color-scheme:dark;--bg:#101714;--panel:#19221e;--raised:#202c26;--line:#33433a;--text:#edf4ed;--muted:#a2b1a7;--accent:#a7f074}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}body.light{color-scheme:light;--bg:#f2f5ef;--panel:white;--raised:#eef3eb;--line:#d7e0d4;--text:#17221b;--muted:#637369;--accent:#397f23}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px}button,input,select{font:inherit}input,select{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:11px;padding:10px;min-height:44px}.pill{background:var(--raised);color:var(--text);border:1px solid var(--line);border-radius:99px;padding:0 15px;min-height:44px}.primary{background:var(--accent);color:#132016;font-weight:700}.small{font-size:.82rem;color:var(--muted)}.bar{height:8px;background:var(--raised);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}.cell{min-height:82px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:left}.green{background:#203d2b}.yellow{background:#40351c}.grey{opacity:.7}.cell:focus{outline:2px solid var(--accent)}</style></head><body><div id="root"></div><script type="text/babel">
const{useState,useEffect,useMemo,useRef}=React,S='2026-10-11',MS=86400000,cycle=['Pull Day','Cardio Day','Push Day','Rest Day','Leg Day','Cardio Day','Rest Day'],meals=[['Salmon bowl','150 g cooked salmon, 120 g cooked brown rice, 150 g steamed broccoli, 1 tsp extra-virgin olive oil.',530,40],['Chicken and lentil plate','120 g cooked chicken breast, 150 g cooked lentils, roasted zucchini and cauliflower, olive oil.',465,55],['Turkey and sweet potato','Turkey breast, baked sweet potato, steamed broccoli, avocado, olive oil.',470,43],['Egg and vegetable skillet','Eggs, egg whites, zucchini, tomatoes, sweet potato, olive oil, cottage cheese.',510,38],['Turkey and lentil stew','Turkey breast, lentils, tomatoes, zucchini, cauliflower, olive oil.',400,49]],iso=d=>new Date(d).toISOString().slice(0,10),at=n=>iso(Date.parse(S)+(n-1)*MS),dn=s=>Math.round((Date.parse(s)-Date.parse(S))/MS)+1,fmt=s=>new Date(s+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'}),blank=()=>({breakfast:false,lunch:0,dinner:0,extra:0,offPlan:false,offPlanText:'',workoutDone:false,duration:'',notes:'',weight:'',belly:''}),read=()=>{try{return JSON.parse(localStorage.getItem('fitness60-data')||'{}')}catch{return{}}};
function App(){const[data,setData]=useState(read),[date,setDate]=useState(()=>{let t=iso(new Date);return t>='2026-10-11'&&t<='2026-12-09'?t:S}),[grid,setGrid]=useState(false),[dark,setDark]=useState(localStorage.getItem('fitness60-dark')!=='false'),[toast,setToast]=useState(''),file=useRef(),touch=useRef(null),day=dn(date),d={...blank(),...data[date]},session=cycle[(day-1)%7];useEffect(()=>localStorage.setItem('fitness60-data',JSON.stringify(data)),[data]);useEffect(()=>{document.body.classList.toggle('light',!dark);localStorage.setItem('fitness60-dark',String(dark))},[dark]);const set=(k,v)=>setData(o=>({...o,[date]:{...blank(),...o[date],[k]:v}})),tot=useMemo(()=>{let k=d.breakfast?120:0,p=d.breakfast?24:0;[d.lunch,d.dinner,d.extra].forEach(i=>{if(i){k+=meals[i-1][2];p+=meals[i-1][3]}});return[k,p]},[d]);function msg(v){setToast(v);setTimeout(()=>setToast(''),2200)}const status=s=>{let x=data[s];if(!x||!Object.values(x).some(v=>v!==''&&v!==false&&v!==0))return'grey';return x.breakfast&&x.lunch&&x.dinner&&x.workoutDone&&!x.offPlan?'green':'yellow'},entries=Object.entries(data).filter(([s])=>s>='2026-10-11'&&s<='2026-12-09').sort(([a],[b])=>a.localeCompare(b)),full=Array.from({length:60},(_,i)=>at(i+1)).filter(s=>status(s)==='green').length,done=entries.filter(([,x])=>x.workoutDone).length,food=entries.filter(([,x])=>x.breakfast||x.lunch||x.dinner||x.extra),avg=food.length?Math.round(food.reduce((a,[,x])=>a+(x.breakfast?24:0)+(x.lunch?meals[x.lunch-1][3]:0)+(x.dinner?meals[x.dinner-1][3]:0)+(x.extra?meals[x.extra-1][3]:0),0)/food.length):0,weights=entries.filter(([,x])=>x.weight!==''),bellies=entries.filter(([,x])=>x.belly!==''),change=(key,a,b)=>a&&b?+(+b[1][key]-+a[1][key]).toFixed(1):null;
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({version:1,data,dark},null,2)],{type:'application/json'}));a.download='60-day-fitness-plan.json';a.click();URL.revokeObjectURL(a.href);msg('Backup exported')}function restore(e){let f=e.target.files&&e.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{try{let q=JSON.parse(r.result),src=q.data||q;if(!src||typeof src!=='object'||Array.isArray(src))throw 0;let clean={};for(let i=1;i<=60;i++)if(src[at(i)])clean[at(i)]={...blank(),...src[at(i)]};setData(clean);if(typeof q.dark==='boolean')setDark(q.dark);msg('Backup restored')}catch{msg('Could not import JSON')}e.target.value=''};r.readAsText(f)}function demo(){let v={};for(let i=1;i<=14;i++)v[at(i)]={...blank(),breakfast:true,lunch:i%5+1,dinner:(i+2)%5+1,extra:i%4===0?2:0,offPlan:i===6,offPlanText:i===6?'Birthday cake':'',workoutDone:cycle[(i-1)%7]!=='Rest Day',duration:'40',weight:(84.2-i*.12).toFixed(1),belly:(96-i*.22).toFixed(1)};setData(v);msg('Demo data loaded for Days 1–14')}
function meal(label,key,none){return <div className="grid gap-2 sm:grid-cols-[220px_1fr]"><label className="grid gap-1 small">{label}<select value={d[key]} onChange={e=>set(key,+e.target.value)}><option value="0">{none}</option>{meals.map((m,i)=><option value={i+1}>Option {i+1} · {m[0]}</option>)}</select></label>{d[key]?<div className="rounded-xl bg-[var(--raised)] p-3"><b>{meals[d[key]-1][0]} · {meals[d[key]-1][2]} kcal · {meals[d[key]-1][3]} g protein</b><div className="small">{meals[d[key]-1][1]}</div></div>:<div className="small">Choose an option</div>}</div>}
function chart(){let w=Array.from({length:60},(_,i)=>data[at(i+1)]&&data[at(i+1)].weight?+data[at(i+1)].weight:null),b=Array.from({length:60},(_,i)=>data[at(i+1)]&&data[at(i+1)].belly?+data[at(i+1)].belly:null),vals=w.filter(Boolean),lo=Math.min(78,...vals)-1,hi=Math.max(85,...vals)+1,W=900,H=240,L=40,x=i=>L+i*(W-L-15)/59,y=v=>15+(hi-v)*180/(hi-lo),path=a=>a.map((v,i)=>v==null?'':(i?'L':'M')+x(i)+' '+y(v)).filter(Boolean).join(' '),goal=y(80);return <svg viewBox={'0 0 '+W+' '+H} className="w-full">{[0,1,2,3,4].map(i=><line x1={L} x2={W-15} y1={15+i*45} y2={15+i*45} stroke="var(--line)"/>)}<line x1={L} x2={W-15} y1={goal} y2={goal} stroke="#f4c768" strokeDasharray="6 6"/><text x={W-90} y={goal-6} fill="#f4c768">80 kg Goal</text><path d={path(w)} fill="none" stroke="#a7f074" strokeWidth="3"/><path d={path(b.map(v=>v==null?null:lo+v-85))} fill="none" stroke="#83bfff" strokeWidth="3"/>{[0,14,29,44,59].map(i=><text x={x(i)} y={H-4} fill="var(--muted)">Day {i+1}</text>)}</svg>}
return <main className="mx-auto max-w-6xl px-4 pb-20 pt-6 sm:px-6" onTouchStart={e=>touch.current=e.touches[0].clientX} onTouchEnd={e=>{if(!grid&&touch.current!=null){let dx=e.changedTouches[0].clientX-touch.current;if(Math.abs(dx)>70)setDate(at(Math.max(1,Math.min(60,day+(dx<0?1:-1)))))}touch.current=null}}>
<header className="mb-6 flex flex-wrap items-center justify-between gap-4"><div><p className="small">OCT 11 — DEC 09, 2026 · 60 DAY RESET</p><h1 className="text-3xl font-extrabold">Your daily practice <span style={{color:'var(--accent)'}}>↗</span></h1></div><div className="flex gap-2"><button className={'pill '+(!grid?'primary':'')} onClick={()=>setGrid(false)}>Day Log</button><button className={'pill '+(grid?'primary':'')} onClick={()=>setGrid(true)}>60-Day Grid</button><button className="pill" onClick={()=>setDark(!dark)}>{dark?'☼':'☾'}</button></div></header>
<div className="mb-5 flex flex-wrap items-center justify-between gap-3"><div className="flex items-center gap-3"><button className="pill text-2xl" disabled={day===1} onClick={()=>setDate(at(day-1))}>‹</button><div><div className="small">DAY {day} OF 60</div><b className="text-lg">{fmt(date)}</b></div><button className="pill text-2xl" disabled={day===60} onClick={()=>setDate(at(day+1))}>›</button></div><label className="grid gap-1 small">Jump to date<input type="date" min={S} max="2026-12-09" value={date} onChange={e=>e.target.value&&setDate(e.target.value)}/></label></div>
<div className="mb-5"><div className="mb-1 flex justify-between small"><span>Timeline progress</span><span>{Math.round(day/60*100)}%</span></div><div className="bar"><i style={{width:(day/60*100)+'%'}}/></div></div><div className="mb-5 flex flex-wrap gap-2"><button className="pill primary" onClick={backup}>↓ Export JSON</button><button className="pill" onClick={()=>file.current.click()}>↑ Import JSON</button><input ref={file} type="file" accept=".json,application/json" className="hidden" onChange={restore}/><button className="pill" onClick={demo}>✦ Load demo data</button></div>
{!grid?<div className="grid gap-5 lg:grid-cols-2"><section className="card p-5"><div className="small">01 / NUTRITION</div><div className="flex justify-between"><h2 className="text-xl font-bold">Meals & nutrition</h2><b style={{color:d.offPlan?'#f4c768':'var(--accent)'}}>{d.offPlan?'OFF PLAN':'ON TRACK'}</b></div><div className="mb-4 rounded-xl bg-[var(--raised)] p-3"><div className="small mb-2 font-semibold">FIVE MEAL OPTIONS</div><div className="space-y-1 small"><div><b>1 · Salmon bowl:</b> 150 g salmon · 120 g brown rice · 150 g broccoli · 1 tsp olive oil</div><div><b>2 · Chicken & lentils:</b> 120 g chicken · 150 g lentils · 150 g zucchini & cauliflower · 1 tsp olive oil</div><div><b>3 · Turkey & sweet potato:</b> 120 g turkey · 150 g sweet potato · 150 g broccoli · 50 g avocado · 1 tsp olive oil</div><div><b>4 · Egg skillet:</b> 2 eggs + 2 whites · 150 g zucchini · 100 g tomato · 150 g sweet potato · 120 g cottage cheese · 1 tsp olive oil</div><div><b>5 · Turkey lentil stew:</b> 120 g turkey · 100 g lentils · 100 g tomato · 100 g zucchini · 100 g cauliflower · 1 tsp olive oil</div></div></div><div className="my-4 grid grid-cols-2 gap-3">{[['Energy',tot[0],1650,'kcal'],['Protein',tot[1],150,'g']].map(([a,b,c,u])=><div className="rounded-xl bg-[var(--raised)] p-3"><span className="small">{a}</span><b className="block text-xl">{b} <span className="small">/ {c} {u}</span></b><div className="bar"><i style={{width:Math.min(100,b/c*100)+'%'}}/></div></div>)}</div><div className="space-y-5"><div className="rounded-xl border border-[var(--line)] p-3"><b>Breakfast · Whey Protein Shake</b><div className="small">1 scoop whey shake in water · 120 kcal · 24 g protein</div><label className="flex min-h-11 items-center gap-2"><input type="checkbox" checked={d.breakfast} onChange={e=>set('breakfast',e.target.checked)}/>Eaten</label></div>{meal('Lunch','lunch','Not eaten')}{meal('Dinner','dinner','Not eaten')}{meal('Extra meal / Meal 3 (optional)','extra','None')}<div className="rounded-xl bg-[var(--raised)] p-3"><label className="flex min-h-11 items-center gap-2 font-semibold"><input type="checkbox" checked={d.offPlan} onChange={e=>{set('offPlan',e.target.checked);if(!e.target.checked)set('offPlanText','')}}/>Ate extra today / didn't stick to the plan</label>{d.offPlan&&<label className="grid gap-1 small">What did you eat?<input placeholder="e.g. pizza, ice cream, snacks" value={d.offPlanText} onChange={e=>set('offPlanText',e.target.value)}/></label>}</div></div></section>
<div className="space-y-5"><section className="card p-5"><div className="small">02 / MOVEMENT</div><h2 className="mb-3 text-xl font-bold">Workout / gym</h2><div className="rounded-xl bg-[var(--raised)] p-4"><span className="small">TODAY'S SESSION</span><b className="block text-2xl">{session}</b><label className="flex min-h-[56px] items-center gap-3 text-lg font-bold"><input type="checkbox" className="h-6 w-6" checked={d.workoutDone} onChange={e=>set('workoutDone',e.target.checked)}/>Did it? / Done</label></div><div className="mt-3 grid gap-3 sm:grid-cols-2"><label className="grid gap-1 small">Duration (min)<input type="number" min="0" value={d.duration} onChange={e=>set('duration',e.target.value)}/></label><label className="grid gap-1 small">Workout notes<input value={d.notes} onChange={e=>set('notes',e.target.value)}/></label></div></section>
<section className="card p-5"><div className="small">03 / MEASUREMENTS</div><h2 className="mb-3 text-xl font-bold">Body composition</h2><div className="grid grid-cols-2 gap-3"><label className="grid gap-1 small">Weight · kg<input type="number" step=".1" value={d.weight} onChange={e=>set('weight',e.target.value)}/></label><label className="grid gap-1 small">Belly at navel · cm · optional<input type="number" step=".1" value={d.belly} onChange={e=>set('belly',e.target.value)}/></label></div><div className="mt-4 grid grid-cols-2 gap-3">{[['Weight',weights,'weight','kg'],['Belly',bellies,'belly','cm']].map(([n,a,k,u])=>{let f=a[0],l=a.at(-1),c=change(k,f,l),wk=a.length>1?+((+l[1][k]-+f[1][k])/((dn(l[0])-dn(f[0]))/7)).toFixed(2):'—';return <div className="rounded-xl bg-[var(--raised)] p-3"><span className="small">{n} · START / CHANGE</span><b className="block">{f?(+f[1][k]).toFixed(1)+' '+u:'—'} / {c==null?'—':(c>0?'+':'')+c+' '+u}</b><span className="small">Avg {wk} {u}/wk</span></div>})}</div></section></div><section className="card p-5 lg:col-span-2"><div className="small">60 DAY TREND</div><h2 className="text-xl font-bold">Body measurements</h2><div className="small">Green weight · kg　 Blue belly · cm</div>{chart()}</section></div>:<><section className="card mb-5 p-5"><div className="small">AT A GLANCE</div><h2 className="mb-4 text-xl font-bold">Transformation summary</h2><div className="grid grid-cols-2 gap-3 md:grid-cols-3 xl:grid-cols-6">{[['Fully complete',full+' / 60'],['Workouts',done+' / 43'],['Avg protein',avg+' g',food.length+' logged days'],['Latest weight',weights.length?(+weights.at(-1)[1].weight).toFixed(1)+' kg':'—',change('weight',weights[0],weights.at(-1))],['Latest belly',bellies.length?(+bellies.at(-1)[1].belly).toFixed(1)+' cm':'—',change('belly',bellies[0],bellies.at(-1))],['Days logged',entries.length+' / 60']].map(([a,b,c])=><div className="rounded-xl bg-[var(--raised)] p-3"><span className="small">{a}</span><b className="block text-xl">{b}</b>{c!=null&&<span className="small">{c}</span>}</div>)}</div></section><section className="card p-4"><div className="mb-4 flex flex-wrap justify-between"><h2 className="text-xl font-bold">60-day overview</h2><span className="small">🟢 Complete　🟡 In progress　⚪ Empty</span></div><div className="grid grid-cols-3 gap-2 sm:grid-cols-5 md:grid-cols-6 lg:grid-cols-8 xl:grid-cols-10">{Array.from({length:60},(_,i)=>{let s=at(i+1),st=status(s);return <button className={'cell '+st} onClick={()=>{setDate(s);setGrid(false)}} aria-label={'Day '+(i+1)+', '+fmt(s)+', '+cycle[i%7]}><b>Day {i+1}</b><div className="small">{new Date(s+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})}</div><div className="small">{cycle[i%7]}</div></button>})}</div></section></>}
{toast&&<div role="status" className="fixed bottom-5 left-1/2 -translate-x-1/2 rounded-full bg-lime-300 px-5 py-3 font-bold text-green-950">{toast}</div>}<footer className="mt-8 text-center small">Your data stays on this device · Last day: Wednesday, December 9, 2026</footer></main>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
